[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "apac-codec"
version = "1.0.0"
description = "APAC: a lossless and lossy audio codec - predictive residual coding with Rice entropy coding and optional DCT pre-shaping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
apac = "audio_codec.main:main"

[tool.setuptools.packages.find]
where = ["src"]
